name: Python service CI and rollback

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: Run pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies and test the API
        run: |
          mkdir -p reports/unit
          python -m pip install -r requirements-test.txt 2>&1 | tee reports/unit/install.log
          python -m pytest -q tests --junitxml=reports/unit/pytest.xml 2>&1 | tee reports/unit/pytest.log
      - name: Preserve pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-reports
          path: reports/unit
          retention-days: 5

  build:
    name: Build ARM64 image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build and label the image
        run: |
          mkdir -p reports/build
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA"
          docker build \
            --build-arg "APP_VERSION=$GITHUB_SHA" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$image" . 2>&1 | tee reports/build/docker-build.log
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            docker save "$image" | gzip -1 > candidate.tar.gz
          fi
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: docker-build-reports
          path: reports/build
          retention-days: 5
      - name: Pass the exact image to delivery
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: candidate-image
          path: candidate.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  deploy:
    name: Deploy and verify on Linux
    needs: [tests, build]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/lab/'))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 8
    concurrency:
      group: practice-6-training-rollout
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      APP_PORT: "8080"
      HOST_PORT: "8098"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Prepare diagnostics and install Testinfra
        run: |
          mkdir -p reports/deploy
          python -m pip install -r requirements-test.txt 2>&1 | tee reports/deploy/install.log
      - uses: actions/download-artifact@v7
        with:
          name: candidate-image
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish by commit hash and deploy candidate
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker load --input candidate.tar.gz 2>&1 | tee reports/deploy/docker-load.log
          docker push "$repo:$GITHUB_SHA" 2>&1 | tee reports/deploy/registry-push.log
          bash ci/deploy.sh "$repo" "$GITHUB_SHA" 2>&1 | tee reports/deploy/rollout.log
      - name: Collect final container state and stop the lab
        if: always()
        run: |
          mkdir -p reports/deploy
          export APP_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA"
          docker compose ps --all > reports/deploy/final-state.txt 2>&1 || true
          docker compose logs --no-color --timestamps service > reports/deploy/final-container.log 2>&1 || true
          docker compose down >> reports/deploy/final-state.txt 2>&1 || true
      - name: Preserve Testinfra, HTTP and container diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: deployment-reports
          path: reports/deploy
          retention-days: 5
